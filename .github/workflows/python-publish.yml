# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    # fetch-depth: 0 pulls the full history and tags so `git describe` below can resolve them
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine
    # Previously WyriHaximus/github-action-get-previous-tag@master and
    # DamianReeves/write-file-action@master.  Both were third-party actions tracking a mutable
    # branch, in the one workflow that holds secrets.PYPI -- a compromise of either upstream
    # would have leaked the publish token.  Inlined so there is no third-party code in this job.
    - name: Get Previous tag
      id: previoustag
      run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
    - name: Set release tag in VERSION
      env:
        # passed via env rather than interpolated into the script to avoid a shell-injection sink
        PREVIOUS_TAG: ${{ steps.previoustag.outputs.tag }}
      run: printf '%s\n' "$PREVIOUS_TAG" > VERSION
    - name: Build and publish
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI }}
      run: |
        python setup.py sdist bdist_wheel
        twine upload dist/*
